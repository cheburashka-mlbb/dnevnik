<head>

<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Мой дневник</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Literata:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: sidebar of pages + one paper sheet. Dot-grid paper like a bullet journal; accent hue is user-set. */
:root{
  --ah:255;--ac:.11;--al:.47;--on-accent:oklch(.99 0 0);
  --bg:oklch(.965 .006 255);--surface:oklch(.992 .003 255);--fg:oklch(.25 .02 258);--muted:oklch(.5 .02 258);
  --line:oklch(.9 .008 255);--dot:oklch(.8 .012 255);--danger:oklch(.54 .17 25);
  --accent:oklch(var(--al) var(--ac) var(--ah));
  --accent-soft:color-mix(in oklab,var(--accent) 11%,var(--surface));
  --ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --write:"Literata",Georgia,"Times New Roman",serif;--wsize:1rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --al:.76;--on-accent:oklch(.2 .02 258);--bg:oklch(.2 .01 258);--surface:oklch(.245 .012 258);--fg:oklch(.93 .008 258);
  --muted:oklch(.72 .015 258);--line:oklch(.33 .014 258);--dot:oklch(.4 .016 258);--danger:oklch(.72 .15 25);color-scheme:dark}}
:root[data-theme="dark"]{
  --al:.76;--on-accent:oklch(.2 .02 258);--bg:oklch(.2 .01 258);--surface:oklch(.245 .012 258);--fg:oklch(.93 .008 258);
  --muted:oklch(.72 .015 258);--line:oklch(.33 .014 258);--dot:oklch(.4 .016 258);--danger:oklch(.72 .15 25);color-scheme:dark}
:root[data-font="sans"]{--write:"Onest",system-ui,sans-serif}
:root[data-font="hand"]{--write:"Caveat","Segoe Script",cursive;--wsize:1.3rem}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1120px;margin:0 auto;padding-block:20px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{font:600 1.15rem/1.25 var(--write);letter-spacing:.005em;overflow-wrap:anywhere}
.brand small{display:block;font:500 .72rem var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:baseline;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.nav button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button small{color:var(--muted);font-size:.72rem;flex:none}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current=page]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.side-foot{display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;
  background:var(--bg);padding:6px 0}
.topbar .grow{flex:1}
.status{font-size:.8rem;color:var(--muted)}
.status.err{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.pri:hover:not(:disabled){color:var(--on-accent);filter:brightness(1.07)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,36px);min-height:60vh;min-width:0}
html[data-paper=dots] .sheet{background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.4px);background-size:24px 24px;background-position:12px 12px}
html[data-paper=grid] .sheet{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
html[data-paper=lines] .sheet{background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 12px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
.tip p{margin:0;flex:1}
.in{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 2px;border-radius:0;resize:none;min-width:0}
.in:hover{border-bottom-color:var(--line)}
.in:focus{outline:none;border-bottom-color:var(--accent)}
.write{font-family:var(--write);font-size:var(--wsize);line-height:1.6}
.in::placeholder{color:var(--muted);opacity:.7}
.ptitle{font:600 clamp(1.5rem,4vw,2rem)/1.2 var(--write);margin:0 0 4px;padding-inline:0}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch;text-wrap:pretty}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
.sec-h .in{font:600 1.12rem var(--write);width:auto;flex:1}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);background:var(--surface)}
.empty b{color:var(--fg);display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:4px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.row .ck{margin-top:5px}
.row>.grow{flex:1;min-width:0}
.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-content:center;cursor:pointer;flex:none;margin:0;background:var(--surface)}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .strk{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.seg{display:flex;gap:3px}
.seg button{width:24px;height:16px;padding:3px 0;border:0;background:var(--line);background-clip:content-box;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--accent);background-clip:content-box}
.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 7px;line-height:1.4}
.icon:hover{color:var(--danger);background:var(--accent-soft)}
.icon.neutral:hover{color:var(--accent)}
.more{display:grid;gap:6px;margin:4px 0 8px;padding-left:2px}
.date-in{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.notes{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}
.nlist{display:flex;flex-direction:column;gap:4px;min-width:0}
.nitem{text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;display:block;width:100%;min-width:0}
.nitem:hover{background:var(--accent-soft)}
.nitem[aria-current=true]{border-color:var(--accent);background:var(--accent-soft)}
.nitem b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neditor{min-width:0;display:flex;flex-direction:column;gap:8px}
.neditor .ntitle{font:600 1.4rem var(--write)}
.back{display:none}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tgrid{border-collapse:separate;border-spacing:0;min-width:100%}
.tgrid th,.tgrid td{padding:3px;text-align:center;font-weight:400;font-size:.78rem;color:var(--muted)}
.tgrid th.today{color:var(--accent);font-weight:600}
.tgrid .hn{position:sticky;left:0;background:var(--surface);text-align:left;min-width:170px;max-width:230px;padding:3px 8px;z-index:2;border-right:1px solid var(--line)}
.tgrid .hn .in{font-size:.92rem;color:var(--fg)}
.tgrid .hn textarea.hnin{resize:none;overflow:hidden;line-height:1.25;padding:2px 4px;min-height:0;white-space:normal;word-break:break-word}
.tgrid .st{min-width:64px;padding:0 10px;color:var(--fg);white-space:nowrap}
.cell{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;cursor:pointer;padding:0}
.cell:hover{border-color:var(--accent)}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell.fut{opacity:.55}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.daynav h2{font:600 1.25rem var(--write);margin:0;flex:1;min-width:12ch;text-transform:capitalize}
.field{margin-top:20px}
.field>label,.field>.lab{display:block;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field textarea.in{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:72px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.scale button:hover{border-color:var(--accent)}
.scale button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fedit{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);margin-bottom:6px}
.fedit .in{flex:1}
.rec{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer;min-width:0}
.rec:hover,.rec[aria-current=true]{background:var(--accent-soft)}
.rec time{flex:none;font-size:.82rem;color:var(--muted);min-width:7.5ch}
.rec span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px}
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,var(--fg) 35%,transparent);display:flex;justify-content:flex-end}
.panel{width:min(460px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:20px}
.panel h2{font:600 1.3rem var(--write);margin:0}
.panel h3{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts .btn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}
.pitem .in{flex:1}
.types{display:grid;gap:8px}
.types button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.types button:hover{border-color:var(--accent)}
.types b{display:block}.types span{color:var(--muted);font-size:.85rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:12px;align-items:center;
  background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 8px 8px 14px;max-width:calc(100% - 32px)}
#toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
#toast[hidden]{display:none}
.load{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center;gap:6px}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{flex:none;border:1px solid var(--line);background:var(--surface)}
  .nav button small{display:none}
  .side-foot{flex-direction:row;flex-wrap:wrap}
  .notes{grid-template-columns:minmax(0,1fr)}
  .notes[data-open=true] .nlist{display:none}
  .notes[data-open=false] .neditor{display:none}
  .back{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mdot{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--fg) 22%,transparent)}
.mdot.empty{background:transparent;border:1.5px dashed var(--muted);box-shadow:none}
.mpick{border:0;background:transparent;cursor:pointer;padding:4px;margin-top:2px;border-radius:8px;display:grid;place-items:center}
.mpick:hover{background:var(--accent-soft)}
.mname{flex:none;font-size:.8rem;color:var(--muted);margin-top:6px;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moment{border-bottom:1px solid var(--line);padding:4px 0 8px}
.mpal{margin:2px 0 6px 34px}
.mtext{margin-left:34px;display:flex;gap:8px;align-items:center;min-width:0}

.mprev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .mdot{width:12px;height:12px;vertical-align:-1px;margin-right:2px}
.hues{display:flex;gap:4px;flex-wrap:wrap}
.hue{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.hue[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.tsec{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
.tsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;border:0;background:transparent;cursor:pointer;padding:8px 0;text-align:left;font:600 1rem var(--write)}
.tsec-h small{font:400 .8rem var(--ui);color:var(--muted)}
.tsec-b{padding:2px 0 10px;display:grid;gap:6px;min-width:0}
.due{font-size:.8rem;color:var(--danger);font-weight:600;flex:none}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.thumb{height:44px;width:44px;object-fit:cover;border-radius:6px;flex:none}
a{color:var(--accent)}
.fedit .grow{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tgrid th.today{background:var(--accent);color:var(--bg);font-weight:700;border-radius:8px 8px 0 0}
.tgrid th.today small{color:inherit}
.tgrid td.today{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.tgrid tr:last-child td.today{border-radius:0 0 8px 8px;box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent),inset 0 -2px 0 var(--accent)}
.tgrid th small{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.03em;opacity:.8}
.cell:disabled,.ncell:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}
.cell:disabled:hover{border-color:var(--line)}
.tgrid .hn .hd{display:block;color:var(--muted);font-size:.7rem;padding-left:2px}
.cell.on{color:var(--bg);font-size:.72rem;font-weight:700}
.ncell{width:40px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;text-align:center;padding:0;font-size:.78rem}
.ncell:focus{border-color:var(--accent);outline:none}
.ncell.on{border-color:var(--accent);color:var(--fg)}
.ncell.met{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.hform select,.hform input{max-width:100%}
.hcharts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.hchart{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);min-width:0}
.hc-h{display:flex;flex-direction:column;margin-bottom:6px}.hc-h small{color:var(--muted);font-size:.76rem}
.hc-svg{display:flex;justify-content:center}
.rtewrap{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:10px 10px 0 0;z-index:3}
.rb{min-width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer;padding:0 8px;font-size:.85rem}
.rb:hover{border-color:var(--accent)}.rb.b{font-weight:700}.rb.i{font-style:italic}.rb.u{text-decoration:underline}.rb.s{text-decoration:line-through}
.rb.sw{font-weight:700;min-width:28px;padding:0}
.rsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.rte{display:block;min-height:260px;padding:12px 14px;outline:none;white-space:pre-wrap;word-break:break-word;border:0}
.rte:empty::before{content:attr(data-ph);color:var(--muted)}
.rte h2{font-size:1.25em;margin:.5em 0 .2em}.rte h3{font-size:1.1em}.rte ul,.rte ol{margin:.3em 0;padding-left:1.4em}
.rte blockquote{border-left:3px solid var(--line);margin:.4em 0;padding-left:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column}
.tile b{font:600 1.4rem var(--write)}.tile span{font-size:.76rem;color:var(--muted)}
.bk-goal{display:flex;align-items:center;gap:12px;margin:10px 0}
.bk-bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bk-bar div{height:100%;background:var(--accent);border-radius:99px}
.shelf{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:14px 10px 0;margin:14px 0;border-bottom:8px solid var(--line);min-height:100px}

.bk-list{display:grid;gap:10px;margin-top:12px}

.bk-h{display:flex;align-items:center;gap:10px}

.stars{display:inline-flex;color:var(--accent);letter-spacing:1px}
.star{background:none;border:0;cursor:pointer;font-size:1.4rem;color:var(--line);padding:0 2px}.star.on{color:var(--accent)}
.badge{font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.badge.st-done{border-color:var(--accent);color:var(--accent)}
.bk-meta{margin:10px 0}.hue{width:90px}
.gbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.85rem}.gbar .gn{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.gt div{height:100%;background:var(--accent);border-radius:99px}
.bk-gh{margin:18px 0 0;font:600 1.05rem var(--write)}.ledits{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.bk-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:45%}
.cpick{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}.cprev{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
.rgbin{width:58px}.sws{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:6px}
.csw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}.csw.on{outline:2px solid var(--accent);outline-offset:1px}
.cover-s{width:42px;height:62px;object-fit:cover;border-radius:4px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cover-l{max-width:140px;max-height:210px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.bkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:12px}
.bkt{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.bkt-c{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bkt-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bkt-n{position:relative;color:#fff;font:600 .85rem var(--write);padding:8px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bkt-img:not([hidden])~.bkt-n{display:none}
.bkt b{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bkt small{color:var(--muted);font-size:.74rem}
.ck-done input.in{text-decoration:line-through;color:var(--muted)}.ckb{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.tq{border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
.setup{max-width:460px;margin:8vh auto;display:grid;gap:14px}
.setup .in{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
</style>

</head>
<body>
<div id="app"><div class="load"><div><b>Открываю дневник…</b><div id="slow" hidden>Связь медленная. Дневник откроется, как только ответит хранилище.</div></div></div></div>
<div id="toast" hidden role="status"></div>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const uidn=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
function h(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(v==null||v===false)continue;
  if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(n==='value')e.value=v;
  else if(n==='checked')e.checked=!!v;else e.setAttribute(n,v===true?(n.startsWith('aria-')?'true':''):v)}
  for(const c of k.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtLong=s=>parseD(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtShort=s=>parseD(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const monthName=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})};
const daysIn=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const shiftMonth=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function auto(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px'}
function ta(value,ph,id,onInput,cls){const e=h('textarea',{class:'in '+(cls||'write'),rows:1,placeholder:ph,id:id,value:value||''});
  e.addEventListener('input',()=>{auto(e);onInput(e.value)});requestAnimationFrame(()=>auto(e));return e}
function inp(value,ph,id,onInput,cls,type){const e=h('input',{class:'in '+(cls||''),type:type||'text',placeholder:ph,id:id,value:value||''});
  e.addEventListener('input',()=>onInput(e.value));return e}

/* ---------- state ---------- */
let PREF={};try{PREF=JSON.parse(localStorage.getItem('dnevnik-pref')||'{}')}catch(e){}
const S={settings:null,pages:[],entries:{},loaded:{},cur:null,db:null,uid:null,local:false,ready:false,dirty:false,
  hist:{undo:[],redo:[]},ui:{settings:false,newPage:false},focus:null,entSub:null,
  view:{sec:{},stab:{},topic:{},pick:null,moodEdit:false,sfilter:'',newHue:90,phEdit:false,week:null,month:today().slice(0,7),date:today(),hideDone:false,open:{},note:{},noteOpen:false,tp:{},tfilter:'all',htab:'chores',nh:{per:'day',mode:'check',goal:1,unit:''},hEdit:null,tsl:null,bk:{},bfilter:'all',byear:new Date().getFullYear(),fieldsEdit:false,q:''}};
const TYPES={goals:{name:'Цели',def:'Цели на жизнь',desc:'Сферы жизни и цели в каждой, с отметкой прогресса.'},
  plans:{name:'Планы',def:'Планы',desc:'Списки дел по срокам: неделя, месяц, год, «когда-нибудь».'},
  notes:{name:'Заметки',def:'Заметки',desc:'Свободные записи с названием и поиском.'},
  tracker:{name:'Трекер',def:'Привычки',desc:'Таблица привычек по дням месяца.'},
  study:{name:'Обучение',def:'План обучения',desc:'Цель курса, база тем с карточками и недельный трекер.'},
  deep:{name:'Увлечения',def:'Целеустремлённость',desc:'Темы, в которые хочется углубиться до уровня мини-эксперта: ступени, вопросы, источники.'},
  home:{name:'Дом',def:'Дом',desc:'Регулярные домашние дела без графиков, список дел, покупки и наблюдения.'},
  books:{name:'Книги',def:'Книжный трекер',desc:'Прочитанное и планы: цель на год, полки, оценки, впечатления и цитаты.'},
  day:{name:'День',def:'Мой день',desc:'Запись на каждую дату с полями, которые настраиваешь сама.'}};
const ACC={blue:[255,.11,'Синий'],sage:[160,.075,'Шалфей'],plum:[330,.12,'Слива'],clay:[40,.115,'Глина'],graphite:[255,.02,'Графит']};
const base=()=>'diary/v2';
const R={settings:()=>S.db.doc(base()),
  page:id=>S.db.doc(base()).collection('pages').doc(id),
  entry:(pid,eid)=>S.db.doc(base()).collection('pages').doc(pid).collection('entries').doc(eid)};
const page=()=>S.pages.find(p=>p.id===S.cur)||null;
function visible(){const o=(S.settings&&S.settings.order)||[];const by=new Map(S.pages.map(p=>[p.id,p]));
  const a=o.map(i=>by.get(i)).filter(Boolean);for(const p of S.pages)if(!o.includes(p.id))a.push(p);return a.filter(p=>!p.archived)}
function newPageData(type,title){const p={id:'p'+uidn(),type,title:title||TYPES[type].def,created:Date.now(),archived:false};
  if(type==='goals')p.areas=[];if(type==='plans')p.groups=[];if(type==='tracker'){p.habits=[];p.marks={};p.vals={}}if(type==='books'){p.books=[];p.target=12}if(type==='deep')p.topics=[];if(type==='home'){p.habits=[];p.marks={};p.vals={};p.todos=[];p.shop=[];p.obs=''}
  if(type==='study'){p.goal={result:'',deadline:'',hours:5,res:[]};p.weeks={}}
  if(type==='day')p.fields=[{id:'f1',label:'Настроение',kind:'scale'},{id:'f2',label:'Главное на сегодня',kind:'tasks'},
    {id:'f3',label:'Благодарность',kind:'long'},{id:'f4',label:'Как прошёл день',kind:'moments'}];if(type==='day')p.moods=clone(DEF_MOODS);
  return p}

/* ---------- local fallback store (same shape as db) ---------- */
function makeLocal(){let st={};try{st=JSON.parse(localStorage.getItem('dnevnik-data')||'{}')}catch(e){}
  const ls=new Set();const save=()=>{try{localStorage.setItem('dnevnik-data',JSON.stringify(st))}catch(e){}};
  const par=p=>p.slice(0,p.lastIndexOf('/'));
  const snap=p=>({id:p.split('/').pop(),exists:p in st,data:()=>p in st?JSON.parse(JSON.stringify(st[p])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  const qs=c=>{const docs=Object.keys(st).filter(k=>par(k)===c).map(snap);return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}};
  const fire=p=>ls.forEach(l=>{if(l.p===p||l.p===par(p))l.f()});
  const doc=p=>({path:p,id:p.split('/').pop(),get:async()=>snap(p),
    set:async d=>{st[p]=JSON.parse(JSON.stringify(d));save();fire(p)},
    delete:async()=>{delete st[p];save();fire(p)},
    onSnapshot:n=>{const l={p,f:()=>n(snap(p))};ls.add(l);setTimeout(l.f,0);return()=>ls.delete(l)},
    collection:n=>col(p+'/'+n)});
  const col=p=>({path:p,doc:id=>doc(p+'/'+id),get:async()=>qs(p),
    onSnapshot:n=>{const l={p,f:()=>n(qs(p))};ls.add(l);setTimeout(l.f,0);return()=>ls.delete(l)}});
  return{doc,collection:col}}

/* ---------- local <-> path mapping ---------- */
function getLocal(p){const s=p.split('/');if(s.length===2)return S.settings;
  if(s.length===4)return S.pages.find(x=>x.id===s[3])||null;
  if(s.length===6)return(S.entries[s[3]]||{})[s[5]]||null;return null}
function setLocal(p,d){const s=p.split('/');
  if(s.length===2){S.settings=d}
  else if(s.length===4){const i=S.pages.findIndex(x=>x.id===s[3]);
    if(d==null){if(i>=0)S.pages.splice(i,1)}else if(i>=0)S.pages[i]=d;else S.pages.push(d)}
  else if(s.length===6){const m=S.entries[s[3]]||(S.entries[s[3]]={});if(d==null)delete m[s[5]];else m[s[5]]=d}}

/* ---------- debounced writer: one write at a time per document ---------- */
const W={q:new Map(),act:{},chain:{},err:false};
const busy=p=>W.q.has(p)||!!W.act[p];
function queue(ref,data,delay){const p=ref.path;const e=W.q.get(p)||{};clearTimeout(e.t);e.ref=ref;e.data=data==null?null:clone(data);
  e.t=setTimeout(()=>flush(p),delay);W.q.set(p,e);setStatus()}
async function flush(p){const e=W.q.get(p);if(!e)return;clearTimeout(e.t);W.q.delete(p);W.act[p]=(W.act[p]||0)+1;
  const prev=W.chain[p]||Promise.resolve();
  const run=prev.then(()=>e.data==null?e.ref.delete():e.ref.set(e.data)).then(()=>{W.err=false},er=>{W.err=true;W.code=(er&&(er.code||er.message))||'';console.error(er)});
  W.chain[p]=run;await run;W.act[p]--;if(!W.act[p])delete W.act[p];setStatus()}
function flushAll(){for(const p of[...W.q.keys()])flush(p)}
addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
function setStatusOld(){const el=$('#status');if(!el)return;const pend=W.q.size||Object.keys(W.act).length;
  el.className='status'+(W.err&&!pend?' err':'');
  el.textContent=pend?'Сохраняю…':W.err?'Не удалось сохранить'+(W.code?' ('+W.code+')':'')+'. Попробую снова при следующей правке':S.local?'Сохранено в этом браузере':'Всё сохранено'}

/* ---------- edits and history (undo/redo) ---------- */
const E={};
function commitEdits(){const ks=Object.keys(E);if(!ks.length)return;const ch=[];
  for(const p of ks){const s=E[p];const after=clone(getLocal(p));if(JSON.stringify(after)!==JSON.stringify(s.before))ch.push({ref:s.ref,before:s.before,after});delete E[p]}
  if(ch.length)pushHist(ch)}
function pushHist(changes){S.hist.undo.push({changes});if(S.hist.undo.length>150)S.hist.undo.shift();S.hist.redo.length=0;syncTop()}
function mutate(ref,fn,o){o=o||{};const p=ref.path;if(!o.typing)commitEdits();
  let cur=getLocal(p);const existed=cur!=null;if(!cur){if(!o.init)return null;cur=clone(o.init)}
  const before=existed?clone(cur):null;fn(cur);setLocal(p,cur);queue(ref,cur,o.typing?650:60);
  if(o.typing){if(!E[p])E[p]={ref,before}}else pushHist([{ref,before,after:clone(cur)}]);return cur}
function create(ref,data){commitEdits();setLocal(ref.path,clone(data));queue(ref,data,60);pushHist([{ref,before:null,after:clone(data)}])}
function destroy(ref){commitEdits();const before=clone(getLocal(ref.path));setLocal(ref.path,null);queue(ref,null,60);pushHist([{ref,before,after:null}])}
function applyState(ref,st){setLocal(ref.path,clone(st));queue(ref,st,60)}
function afterHist(){if(!page()||page().archived)S.cur=(visible()[0]||{}).id||null;applyTheme();selectEntries();syncTop();render()}
function undo(){commitEdits();const a=S.hist.undo.pop();if(!a)return;for(const c of a.changes.slice().reverse())applyState(c.ref,c.before);S.hist.redo.push(a);afterHist()}
function redo(){commitEdits();const a=S.hist.redo.pop();if(!a)return;for(const c of a.changes)applyState(c.ref,c.after);S.hist.undo.push(a);afterHist()}
function syncTop(){const u=$('#b-undo'),r=$('#b-redo');if(u)u.disabled=!S.hist.undo.length;if(r)r.disabled=!S.hist.redo.length}
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  const a=document.activeElement;if(a&&(/^(INPUT|TEXTAREA)$/.test(a.tagName)||a.isContentEditable))return;e.preventDefault();(k==='y'||e.shiftKey)?redo():undo()});
document.addEventListener('focusout',()=>{commitEdits();setTimeout(()=>{if(S.dirty&&!editing()){render()}},140)});
let tt;function toast(msg,undoable){const t=$('#toast');
  t.replaceChildren(...[h('span',{},msg),undoable?h('button',{onclick:()=>{undo();t.hidden=true}},'Вернуть'):null].filter(Boolean));
  t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},6500)}
function editing(){const a=document.activeElement;return!!(a&&a.closest&&a.closest('.main')&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))}
function changed(){if(!S.ready)return;if(editing()){S.dirty=true;return}render()}

/* ---------- theme ---------- */
function applyTheme(){const s=S.settings||PREF;const r=document.documentElement;
  if(s.theme==='light'||s.theme==='dark')r.dataset.theme=s.theme;else delete r.dataset.theme;
  r.dataset.paper=s.paper||'dots';r.dataset.font=s.font||'serif';
  const a=ACC[s.accent]||ACC.blue;r.style.setProperty('--ah',a[0]);r.style.setProperty('--ac',a[1]);
  try{localStorage.setItem('dnevnik-pref',JSON.stringify({theme:s.theme,paper:s.paper,font:s.font,accent:s.accent}))}catch(e){}}

/* ---------- sync with storage ---------- */
let gotS=false,gotP=false,existsS=false,seenS=false,seenP=false,unsubs=[];const CONF=new Set();
function onErr(e){console.error(e);W.err=true;setStatus()}
function onSettings(snap){seenS=true;const p=R.settings().path;
  if(snap.exists){gotS=true;existsS=true;if(!busy(p)){const d=clone(snap.data());if(JSON.stringify(d)!==JSON.stringify(S.settings)){S.settings=d;applyTheme();changed()}}}
  else if(snap.metadata.fromCache!==true){gotS=true;existsS=false}
  maybeBoot()}
function onPages(qs){seenP=true;const b=R.settings().path+'/pages/';const seen=new Set();
  for(const d of qs.docs){seen.add(d.id);if(busy(b+d.id))continue;const data=clone(d.data());data.id=d.id;
    const i=S.pages.findIndex(x=>x.id===d.id);if(i<0)S.pages.push(data);else if(JSON.stringify(S.pages[i])!==JSON.stringify(data))S.pages[i]=data}
  if(qs.metadata.fromCache!==true){seen.forEach(i=>CONF.add(i));S.pages=S.pages.filter(x=>seen.has(x.id)||busy(b+x.id)||!CONF.has(x.id));gotP=true}
  maybeBoot();changed()}
function maybeBoot(force){if(S.ready||(!force&&(!gotS||!gotP)))return;
  if(!existsS){const ps=S.pages.length?[]:['goals','plans','tracker','day','notes'].map(t=>newPageData(t));
    ps.forEach(p=>{S.pages.push(p);queue(R.page(p.id),p,0)});
    const vis=S.pages.filter(p=>!p.archived);
    S.settings={v:1,title:'Мой дневник',theme:PREF.theme||'auto',paper:PREF.paper||'dots',font:PREF.font||'serif',accent:PREF.accent||'blue',
      order:S.pages.map(p=>p.id),last:(vis[0]||{}).id||null,tip:false};
    queue(R.settings(),S.settings,0)}
  S.ready=true;migrate();applyTheme();const v=visible();const last=S.settings.last;S.cur=(v.find(p=>p.id===last)||v[0]||{}).id||null;
  selectEntries();render()}
function selectEntries(){const p=page();const need=p&&(p.type==='notes'||p.type==='day'||p.type==='study')?p.id:null;
  if(S.entSub&&S.entSub.pid===need)return;
  if(S.entSub){S.entSub.un();S.entSub=null}
  if(!need)return;const pid=need;
  S.entSub={pid,un:R.page(pid).collection('entries').onSnapshot(qs=>{
    const m=S.entries[pid]||(S.entries[pid]={});const seen=new Set();
    for(const d of qs.docs){seen.add(d.id);if(busy(R.entry(pid,d.id).path))continue;m[d.id]=clone(d.data())}
    if(qs.metadata.fromCache!==true){for(const k of Object.keys(m))if(!seen.has(k)&&!busy(R.entry(pid,k).path))delete m[k];S.loaded[pid]=true}
    changed()},onErr)}}
function go(id){commitEdits();S.cur=id;S.view.q='';S.view.noteOpen=false;S.view.fieldsEdit=false;S.ui.newPage=false;
  if(S.settings){S.settings.last=id;queue(R.settings(),S.settings,1500)}
  selectEntries();render();window.scrollTo(0,0)}

/* ---------- shell ---------- */
function render(){S.dirty=false;const app=$('#app');const p=page();const op=document.querySelector('.panel');const top=op?op.scrollTop:0;
  app.replaceChildren(h('div',{class:'app'},sidebar(),
    h('div',{class:'main'},topbar(),tipBar(),h('div',{class:'sheet'},p?viewFor(p):noPage()))),
    ...[S.ui.settings?settingsPanel():null,S.ui.newPage?newPagePanel():null].filter(Boolean));
  setStatus();syncTop();const np=document.querySelector('.panel');if(np)np.scrollTop=top;
  if(S.focus){const el=document.getElementById(S.focus);S.focus=null;if(el)el.focus()}}
function sidebar(){return h('aside',{class:'side'},
  h('div',{class:'brand'},h('small',{},parseD(today()).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})),S.settings.title||'Мой дневник'),
  h('nav',{class:'nav','aria-label':'Страницы'},visible().map(p=>h('button',{'data-id':p.id,'aria-current':p.id===S.cur?'page':null,onclick:()=>go(p.id)},
    h('span',{},p.title||'Без названия'),h('small',{},TYPES[p.type]?TYPES[p.type].name:'')))),
  h('div',{class:'side-foot'},
    h('button',{class:'btn quiet',onclick:()=>{S.ui.newPage=true;render()}},'+ Новая страница'),
    h('button',{class:'btn quiet',onclick:()=>{S.ui.settings=true;render()}},'Оформление и копия')))}
function topbar(){return h('div',{class:'topbar'},
  h('button',{class:'btn',id:'b-undo',onclick:undo,title:'Отменить (Ctrl+Z)'},'↶ Отменить'),
  h('button',{class:'btn',id:'b-redo',onclick:redo,title:'Вернуть (Ctrl+Shift+Z)'},'Вернуть ↷'),
  h('span',{class:'grow'}),h('span',{id:'status',class:'status'}))}
function tipBar(){const out=[];
  if(S.local)out.push(h('div',{class:'tip'},h('p',{},'Общее хранилище сейчас недоступно, поэтому записи лежат только в этом браузере. Сделай резервную копию в разделе «Оформление и копия».')));
  if(!S.settings.tip)out.push(h('div',{class:'tip'},h('p',{},'Переписывать ничего не нужно. Всё сохраняется само, любую правку можно отменить кнопкой выше или Ctrl+Z, а удалённое возвращается кнопкой «Вернуть».'),
    h('button',{class:'btn sm',onclick:()=>{S.settings.tip=true;queue(R.settings(),S.settings,60);render()}},'Понятно')));
  return out}
function noPage(){return h('div',{class:'empty'},h('b',{},'Страниц пока нет'),'Создай первую: цели, планы, трекер, заметки или записи по дням.',

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hper=b=>b.per==='week'?'week':'day';

const hmode=b=>b.mode==='count'?'count':'check';
const hgoal=b=>(+b.goal>0?+b.goal:1);
const raz=n=>{n=Math.abs(Math.round(n));return n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'раза':'раз'};
const numTxt=x=>{x=Math.round(x*10)/10;return String(x).replace('.',',')};
function hv(p,hb,date){const mo=date.slice(0,7),day=+date.slice(8);const v=((p.vals||{})[mo]||{})[hb.id];
  if(v&&v[day]!=null)return +v[day]||0;const mk=((p.marks||{})[mo]||{})[hb.id];return mk&&mk.includes(day)?1:0}
function setHv(p,hb,date,val){const mo=date.slice(0,7),day=+date.slice(8);
  return mutate(R.page(p.id),d=>{const vs=d.vals||(d.vals={});const m=vs[mo]||(vs[mo]={});const cur=m[hb.id]||(m[hb.id]={});
    const mk=((d.marks||{})[mo]||{})[hb.id];if(mk&&mk.length){mk.forEach(x=>{if(cur[x]==null)cur[x]=1});d.marks[mo][hb.id]=[]}
    if(val>0)cur[day]=val;else delete cur[day]})}
const weekSum=(p,hb,ws)=>{let s=0;for(let i=0;i<7;i++)s+=hv(p,hb,addDays(ws,i));return s};
function hdesc(hb){const g=hgoal(hb),u=hb.unit?' '+hb.unit:'';
  if(hper(hb)==='day')return hmode(hb)==='count'?numTxt(g)+u+' в день':(g>1?g+' '+raz(g)+' в день':'каждый день');
  return hmode(hb)==='count'?numTxt(g)+u+' в неделю':g+' '+raz(g)+' в неделю'}
function hStats(p,hb,mo,T){const nd=daysIn(mo);const cm=T.slice(0,7);const td=mo===cm?+T.slice(8):(mo<cm?nd:0);const g=hgoal(hb);
  if(hper(hb)==='day'){let met=0,sum=0;const days=[];
    for(let d=1;d<=nd;d++){const v=hv(p,hb,mo+'-'+pad(d));days.push(v);if(d<=td){sum+=v;if(v>=g)met++}}
    return{kind:'day',nd,td,days,met,sum,pct:td?Math.round(met/td*100):0}}
  const weeks=[];let ws=mondayOf(mo+'-01');const last=mo+'-'+pad(nd);
  while(ws<=last){weeks.push({ws,tot:weekSum(p,hb,ws),started:ws<=T,cur:ws===mondayOf(T)});ws=addDays(ws,7)}
  return{kind:'week',nd,td,weeks,done:weeks.filter(w=>w.started&&w.tot>=g).length,elapsed:weeks.filter(w=>w.started).length}}
function streak(p,hb,T){const g=hgoal(hb);let d=T,n=0;if(hv(p,hb,d)<g)d=addDays(d,-1);
  for(let i=0;i<400;i++){if(hv(p,hb,d)>=g){n++;d=addDays(d,-1)}else break}return n}

function donutSvg(frac,center,sub){const r=42,C=2*Math.PI*r;const f=Math.max(0,Math.min(1,frac));
  return '<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="'+esc(center+' '+sub)+'">'+
   '<circle cx="60" cy="60" r="'+r+'" fill="none" style="stroke:var(--line)" stroke-width="14"/>'+
   (f>0?'<circle cx="60" cy="60" r="'+r+'" fill="none" style="stroke:var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(C*f).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>':'')+
   '<text x="60" y="62" text-anchor="middle" font-size="22" font-weight="600" style="fill:var(--fg)">'+esc(center)+'</text>'+
   '<text x="60" y="80" text-anchor="middle" font-size="10" style="fill:var(--muted)">'+esc(sub)+'</text></svg>'}
function barsSvg(vals,goal,opt){const W=320,H=140,L=6,R_=6,T0=18,B=22;const n=vals.length;const slot=(W-L-R_)/n,bw=Math.max(3,slot*.68);
  const mx=Math.max(goal*1.3,...vals.map(v=>v||0),1);const y=v=>H-B-(v/mx)*(H-B-T0);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(opt.label)+'" style="max-width:420px">';
  s+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R_)+'" y2="'+(H-B)+'" style="stroke:var(--line)"/>';
  vals.forEach((v,i)=>{const x=L+i*slot+(slot-bw)/2;const sh=opt.shown(i);
    if(sh&&v>0)s+='<rect x="'+x.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+((H-B)-y(v)).toFixed(1)+'" rx="2" style="fill:var(--accent)" fill-opacity="'+(v>=goal?1:.45)+'"/>';
    if(opt.mark(i))s+='<rect x="'+(x-2).toFixed(1)+'" y="'+(T0-6)+'" width="'+(bw+4).toFixed(1)+'" height="'+(H-B-T0+6)+'" rx="3" fill="none" style="stroke:var(--fg)" stroke-width="1.2" stroke-dasharray="2 2"/>';
    if(opt.val&&sh&&v>0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y(v)-3).toFixed(1)+'" text-anchor="middle" font-size="9" style="fill:var(--fg)">'+numTxt(v)+'</text>';
    const lb=opt.label_(i);if(lb)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9" style="fill:var(--muted)">'+esc(lb)+'</text>'});
  s+='<line x1="'+L+'" y1="'+y(goal).toFixed(1)+'" x2="'+(W-R_)+'" y2="'+y(goal).toFixed(1)+'" style="stroke:var(--fg)" stroke-opacity=".55" stroke-dasharray="4 3"/>';
  s+='<text x="'+(W-R_)+'" y="'+(y(goal)-4).toFixed(1)+'" text-anchor="end" font-size="9" style="fill:var(--muted)">цель '+numTxt(goal)+'</text></svg>';return s}
function habitChart(p,hb,mo,T){const s=hStats(p,hb,mo,T);const g=hgoal(hb);const u=hb.unit?' '+hb.unit:'';const card=h('div',{class:'hchart'});
  let svg='',note='';const cm=T.slice(0,7),tdy=mo===cm?+T.slice(8):0;

const SAFE_C=/^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\)|[a-z]{3,20})$/i;
const RTE_MAP={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',S:'s',STRIKE:'s',DEL:'s',BR:'br',DIV:'div',P:'div',LI:'li',UL:'ul',OL:'ol',H1:'h2',H2:'h2',H3:'h3',BLOCKQUOTE:'blockquote',SPAN:'span',FONT:'span',MARK:'span'};
function cleanNode(n,out){for(const c of Array.from(n.childNodes)){
  if(c.nodeType===3){out.append(c.textContent);continue}
  if(c.nodeType!==1)continue;const tg=c.tagName;
  if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|NOSCRIPT)$/.test(tg))continue;
  const nt=RTE_MAP[tg];if(!nt){cleanNode(c,out);continue}
  const e=document.createElement(nt);
  if(nt==='span'){let st='';const col=(c.style&&c.style.color)||c.getAttribute('color')||'';const bg=(c.style&&c.style.backgroundColor)||'';
    if(col&&SAFE_C.test(col))st+='color:'+col+';';
    if(bg&&SAFE_C.test(bg))st+='background-color:'+bg+';';else if(tg==='MARK')st+='background-color:rgba(255,214,10,.4);';
    if(!st){cleanNode(c,out);continue}e.setAttribute('style',st)}
  if(nt!=='br')cleanNode(c,e);out.append(e)}}

    if(!branch){const i=await api('GET','');branch=i.default_branch||'main'}
    const f=j.kind==='file'?j.path:fileOf(j.path);
    if(j.kind==='doc'&&j.data==null){if(!sha[f])return;
      try{await api('DELETE','/contents/'+encPath(f),{message:'Удаление '+j.path,sha:sha[f],branch})}
      catch(e){if(e.status===404){delete sha[f];return}if(e.status===409||e.status===422){await refreshSha(f);if(!sha[f])return;await api('DELETE','/contents/'+encPath(f),{message:'Удаление '+j.path,sha:sha[f],branch})}else throw e}
      delete sha[f];persist();return}
    const body={message:(j.kind==='file'?'Файл ':'Запись ')+j.path,content:j.kind==='file'?bytesToB64(j.bytes):strB64(JSON.stringify(j.data)),branch};
    if(sha[f])body.sha=sha[f];
    let r;
    try{r=await api('PUT','/contents/'+encPath(f),body)}
    catch(e){if(e.status===409||e.status===422){await refreshSha(f);if(sha[f])body.sha=sha[f];else delete body.sha;r=await api('PUT','/contents/'+encPath(f),body)}else throw e}
    sha[f]=r.content.sha;persist()}
  async function pump(){if(running)return;running=true;
    while(jobs.length){const j=jobs[0];active=j;
      try{await run(j);jobs.shift();err=null;active=null;j.resolve&&j.resolve()}
      catch(e){active=null;if(j.kind==='file'){jobs.shift();j.reject&&j.reject(e);continue}
        err=ghDesc(e);running=false;notify();setTimeout(pump,15000);return}
      notify()}
    running=false;notify()}
  function addJob(j){if(j.kind==='doc'){const i=jobs.findIndex(x=>x.kind==='doc'&&x.path===j.path&&x!==active);if(i>=0)jobs.splice(i,1)}jobs.push(j);notify();pump()}
  const pendingDoc=p=>jobs.some(j=>j.kind==='doc'&&j.path===p);
  async function sync(){
    try{
      if(!branch){const i=await api('GET','');branch=i.default_branch||'main'}
      const r=await fetch(API+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1',{headers:Object.assign({},H,etag?{'If-None-Match':etag}:{})});
      if(r.status===304){synced=true;err=jobs.length?err:null;notify();return}
      let tree=[];
      if(r.status===409||r.status===404){tree=[];etag=null}
      else if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
      else{etag=r.headers.get('ETag');tree=(await r.json()).tree||[]}
      const now={};for(const t of tree)if(t.type==='blob'&&t.path.startsWith('data/')&&t.path.endsWith('.json'))now[t.path]=t.sha;
      const changed=new Set();
      const todo=Object.keys(now).filter(f=>sha[f]!==now[f]&&!pendingDoc(f.slice(5,-5)));
      let k=0;const worker=async()=>{while(k<todo.length){const f=todo[k++];
        const j=await api('GET','/git/blobs/'+now[f]);const txt=new TextDecoder().decode(b64ToBytes(j.content));
        const p=f.slice(5,-5);if(pendingDoc(p))continue;
        try{st[p]=JSON.parse(txt);sha[f]=now[f];changed.add(p)}catch(e){}}};
      await Promise.all([worker(),worker(),worker(),worker()]);
      for(const f of Object.keys(sha)){if(f.startsWith('data/')&&!(f in now)&&!pendingDoc(f.slice(5,-5))){const p=f.slice(5,-5);if(p in st){delete st[p];changed.add(p)}delete sha[f]}}
      const first=!synced;synced=true;err=jobs.length?err:null;persist();
      if(first)fireAll();else changed.forEach(fire);
      notify()
    }catch(e){err=ghDesc(e);notify()}}
  const doc=p=>({path:p,id:p.split('/').pop(),
    get:async()=>snap(p),
    set:async d=>{st[p]=JSON.parse(JSON.stringify(d));persist();fire(p);addJob({kind:'doc',path:p,data:JSON.parse(JSON.stringify(d))})},
    delete:async()=>{delete st[p];persist();fire(p);addJob({kind:'doc',path:p,data:null})},
    onSnapshot:(n,ef)=>{const l={p,f:()=>n(snap(p))};ls.add(l);setTimeout(l.f,0);return()=>ls.delete(l)},
    collection:n=>col(p+'/'+n)});
  const col=p=>({path:p,doc:id=>doc(p+'/'+id),get:async()=>qs(p),
    onSnapshot:(n,ef)=>{const l={p,f:()=>n(qs(p))};ls.add(l);setTimeout(l.f,0);return()=>ls.delete(l)}});
  const db={doc,collection:col,sync,
    pending:()=>jobs.length,get err(){return err},
    putFile:(path,bytes)=>new Promise((resolve,reject)=>addJob({kind:'file',path,bytes,resolve,reject})),
    flushed:()=>new Promise(r=>{const t=setInterval(()=>{if(!jobs.length&&!running){clearInterval(t);r()}},200)}),
    clearCache:()=>{try{localStorage.removeItem(ck)}catch(e){}}};
  return db}

/* ---------- standalone: boot, setup, files, import/export ---------- */
function disconnect(){const go=()=>{try{if(S.db&&S.db.clearCache)S.db.clearCache();localStorage.removeItem(CFG_KEY)}catch(e){}location.reload()};
  if(S.db&&S.db.pending&&S.db.pending()){toast('Дожидаюсь сохранения…');S.db.flushed().then(go)}else go()}
function stuck(msg){if(S.ready)return;$('#app').replaceChildren(h('div',{class:'load'},h('div',{},h('b',{},'Дневник не смог связаться с GitHub'),
  h('p',{class:'status'},msg||'Проверь интернет и доступ к репозиторию.'),
  h('div',{class:'tools',style:'justify-content:center'},h('button',{class:'btn pri',onclick:()=>location.reload()},'Повторить'),
    h('button',{class:'btn',onclick:disconnect},'Изменить доступ')))))}
function setStatus(){const el=$('#status');if(!el)return;const gp=S.db&&S.db.pending?S.db.pending():0;const ge=S.db&&S.db.err;
  el.className='status'+(ge?' err':'');
  el.textContent=ge?'Не сохранено в GitHub: '+ge+'. Попробую снова':(gp||W.q.size||Object.keys(W.act).length)?'Сохраняю в GitHub…':'Всё сохранено в GitHub'}
function setupScreen(msg){
  const repo=h('input',{class:'in',id:'cfg-repo',placeholder:'логин/dnevnik-data',autocomplete:'off',autocapitalize:'off',value:(CFG&&CFG.repo)||''});
  const tok=h('input',{class:'in',id:'cfg-token',type:'password',placeholder:'github_pat_…',autocomplete:'off'});
  const st=h('p',{class:'status',role:'status'},msg||'');
  const go=async()=>{const r=repo.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');const t=tok.value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(r)){st.textContent='Репозиторий записывается так: логин/dnevnik-data';return}
    if(!t){st.textContent='Вставь токен доступа';return}
    st.textContent='Проверяю доступ…';
    try{const res=await fetch('https://api.github.com/repos/'+r,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});
      if(!res.ok){st.textContent='Не получилось: '+ghDesc({status:res.status});return}
      const info=await res.json();
      if(info.permissions&&info.permissions.push===false){st.textContent='У токена нет права записи. Нужно разрешение Contents: Read and write';return}
      if(!info.private){st.textContent='Репозиторий с данными должен быть приватным, а сейчас он открыт всем';return}
      localStorage.setItem(CFG_KEY,JSON.stringify({repo:r,token:t}));location.reload()}
    catch(e){st.textContent='Нет связи с GitHub. Проверь интернет'}};
  $('#app').replaceChildren(h('div',{class:'setup'},h('h1',{class:'ptitle write'},'Мой дневник'),
    h('p',{class:'lead'},'Подключи хранилище на GitHub. Это делается один раз на каждом устройстве.'),
    h('div',{class:'field'},h('label',{for:'cfg-repo'},'Репозиторий с данными'),repo),
    h('div',{class:'field'},h('label',{for:'cfg-token'},'Токен доступа'),tok),
    h('div',{class:'tools'},h('button',{class:'btn pri',onclick:go},'Подключить')),st,
    h('p',{class:'status'},'Токен хранится только в этом браузере и отправляется только на GitHub.')))}
async function boot(){applyTheme();
  try{CFG=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){}
  if(!CFG||!CFG.repo||!CFG.token){setupScreen('');return}
  S.db=makeGithubDb(CFG);S.uid='gh';S.local=false;S.db.onStatus=()=>setStatus();
  setTimeout(()=>{if(S.ready)return;if(seenS&&seenP)maybeBoot(true);else stuck(S.db.err||'')},12000);
  listen();S.db.sync();
  setInterval(()=>{if(!document.hidden&&S.db)S.db.sync()},40000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.db)S.db.sync()});
  addEventListener('online',()=>{if(S.db)S.db.sync()})}

/* files kept in the repo */
const ghUrls={};
async function fileUrl(m){if(ghUrls[m.p])return ghUrls[m.p];
  const r=await fetch('https://api.github.com/repos/'+CFG.repo+'/contents/'+encPath(m.p),{headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github.raw+json'}});
  if(!r.ok)throw new Error('file '+r.status);const b=await r.blob();return ghUrls[m.p]=URL.createObjectURL(new Blob([b],{type:m.ct||b.type}))}
function fileRow(m,onDel){
  const img=(m.ct||'').startsWith('image/')?h('img',{class:'thumb',alt:m.t||'',hidden:true}):null;
  if(img)fileUrl(m).then(u=>{img.src=u;img.hidden=false}).catch(()=>{});
  const a=h('a',{class:'grow',href:'#',role:'button',onclick:async e=>{e.preventDefault();const w=window.open('','_blank');
    try{const u=await fileUrl(m);if(w)w.location.href=u;else{const x=document.createElement('a');x.href=u;x.download=m.t||'file';x.click()}}
    catch(er){if(w)w.close();toast('Не удалось открыть файл')}}},m.t||'файл');
  return h('div',{class:'fedit'},img,a,h('button',{class:'icon','aria-label':'Убрать файл',onclick:()=>onDel(m.id)},'✕'))}
async function attach(p,t,file){
  if(file.size>20*1024*1024){toast('Файл больше 20 МБ. Уменьши его или сохрани ссылкой');return}
  try{toast('Загружаю «'+file.name+'»…');const buf=new Uint8Array(await file.arrayBuffer());
    const safe=file.name.replace(/[^\w.\-]+/g,'_').slice(-80)||'file';const path='files/'+uidn()+'-'+safe;
    await S.db.putFile(path,buf);
    mutate(R.entry(p.id,t.id),d=>{L(d,'mats').push({id:'f'+uidn(),kind:'file',t:file.name,p:path,ct:file.type||''});d.updated=Date.now()});
    toast('Файл прикреплён');render()}
  catch(e){toast('Не удалось загрузить файл'+(e&&e.status?' ('+e.status+')':''))}}

/* backup and import */
async function exportCopy(){try{
  const data={app:'dnevnik',exported:new Date().toISOString(),settings:S.settings,pages:[]};
  for(const p of S.pages){const o=clone(p);if(p.type==='notes'||p.type==='day'||p.type==='study'){const q=await R.page(p.id).collection('entries').get();o.entries=q.docs.map(d=>d.data())}data.pages.push(o)}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='dnevnik-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  catch(e){toast('Не удалось сохранить копию')}}
async function importCopy(d){
  if(!d||!Array.isArray(d.pages)){toast('Это не файл копии дневника');return}
  const db=S.db,bp=base();let n=0;
  for(const p of S.pages.slice()){
    if(p.type==='notes'||p.type==='day'||p.type==='study'){const q=await R.page(p.id).collection('entries').get();for(const e of q.docs)await db.doc(bp+'/pages/'+p.id+'/entries/'+e.id).delete()}
    await db.doc(bp+'/pages/'+p.id).delete()}
  for(const pg of d.pages){const o=clone(pg);const ents=o.entries||[];delete o.entries;if(!o.id)continue;
    await db.doc(bp+'/pages/'+o.id).set(o);n++;
    for(const e of ents){const id=e.id||e.date;if(id){const x=clone(e);delete x.id;await db.doc(bp+'/pages/'+o.id+'/entries/'+id).set(x)}}}
  await db.doc(bp).set(Object.assign({v:1},d.settings||{},{order:d.pages.map(p=>p.id).filter(Boolean)}));
  toast('Перенесено страниц: '+n+'. Обновляю…');await db.flushed();setTimeout(()=>location.reload(),600)}
function importBtn(){const box=h('span',{});
  const f=h('input',{type:'file',accept:'.json,application/json',hidden:true,id:'imp'});
  const idle=()=>box.replaceChildren(f,h('button',{class:'btn',onclick:()=>f.click()},'Загрузить копию'));
  f.addEventListener('change',async()=>{const file=f.files&&f.files[0];f.value='';if(!file)return;
    let d;try{d=JSON.parse(await file.text())}catch(e){toast('Не удалось прочитать файл копии');return}
    if(!d||!Array.isArray(d.pages)){toast('Это не файл копии дневника');return}
    box.replaceChildren(h('p',{class:'status',style:'margin:0 0 6px'},'Всё, что сейчас в дневнике, будет заменено копией ('+d.pages.length+' стр.). Продолжить?'),
      h('div',{class:'opts'},h('button',{class:'btn pri',onclick:async()=>{box.replaceChildren(h('span',{class:'status'},'Переношу…'));
        try{await importCopy(d)}catch(e){toast('Не удалось перенести данные');idle()}}},'Да, заменить'),h('button',{class:'btn',onclick:idle},'Отмена')))});
  idle();return box}
function ghSection(){return h('div',{},h('h3',{},'Хранилище'),
  h('p',{class:'status',style:'margin:0 0 8px'},'Данные лежат в приватном репозитории '+(CFG?CFG.repo:'')+' на GitHub, файлы в его папке files.'),
  h('button',{class:'btn',onclick:disconnect},'Отключить это устройство'))}

/* ---------- start ---------- */
async function bootClaude(){applyTheme();setTimeout(()=>{if(S.ready)return;if(seenS&&seenP)maybeBoot(true);else stuck('')},12000);const slow=setTimeout(()=>{const s=$('#slow');if(s)s.hidden=false},10000);let db=null,uid=null;
  try{if(window.claude&&claude.use){const d=await claude.use('db');if(d){db=d;uid='shared'}}}catch(e){}
  clearTimeout(slow);
  if(db){S.db=db;S.uid=uid}else{S.local=true;S.db=makeLocal();S.uid='local'}
  listen()}
function listen(){try{unsubs.push(R.settings().onSnapshot(onSettings,onErr));unsubs.push(R.settings().collection('pages').onSnapshot(onPages,onErr))}catch(e){onErr(e);stuck(String(e&&e.message||e))}}
function goLocal(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];S.local=true;S.db=makeLocal();S.uid='local';gotS=gotP=seenS=seenP=false;existsS=false;S.pages=[];S.settings=null;listen()}
function stuckOld(msg){if(S.ready)return;$('#app').replaceChildren(h('div',{class:'load'},h('div',{},h('b',{},'Дневник не смог связаться с хранилищем'),
  h('p',{class:'status'},'Проверь интернет и что ты вошла в тот же аккаунт Claude. '+(msg?('Ошибка: '+msg):'')),
  h('div',{class:'tools',style:'justify-content:center'},h('button',{class:'btn pri',onclick:()=>location.reload()},'Повторить'),
  h('button',{class:'btn',onclick:goLocal},'Открыть без синхронизации')),
  h('p',{class:'status'},'Без синхронизации записи останутся только в этом браузере.'))))}
addEventListener('error',e=>{if(!S.ready)stuck(e.message);else toast('Ошибка: '+e.message)});addEventListener('unhandledrejection',e=>{const r=e.reason;if(S.ready)toast('Ошибка: '+((r&&(r.code||r.message))||r))});
boot();
})();
